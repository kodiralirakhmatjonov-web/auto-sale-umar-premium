name: Deploy Auto Sale Umar

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare project for GitHub Pages
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          base_path = f"/{repo}"

          config = f'''import type {{ NextConfig }} from "next";

          const nextConfig: NextConfig = {{
            output: "export",
            basePath: "{base_path}",
            assetPrefix: "{base_path}",
            images: {{
              unoptimized: true,
            }},
            trailingSlash: true,
          }};

          export default nextConfig;
          '''

          Path("next.config.ts").write_text(config, encoding="utf-8")

          page = Path("app/page.tsx")
          content = page.read_text(encoding="utf-8")

          content = content.replace(
              '"/intro.mp4"',
              '"./intro.mp4"'
          )

          content = content.replace(
              '"/intro-poster.jpg"',
              '"./intro-poster.jpg"'
          )

          content = content.replace(
              '"/cars/',
              '"./cars/'
          )

          page.write_text(content, encoding="utf-8")
          PY

      - name: Build Next.js
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
