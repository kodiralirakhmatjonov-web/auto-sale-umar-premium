name: AutoSale ZIP Patch Installer

on:
  push:
    branches:
      - main
    paths:
      - 'patch-*.zip'

permissions:
  contents: write

concurrency:
  group: autosale-zip-patch-installer
  cancel-in-progress: false

jobs:
  apply-patch:
    name: Verify and apply ZIP patch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout uploaded patch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect uploaded ZIP
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ALL_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          mapfile -t PATCHES < <(printf '%s\n' "${ALL_CHANGED[@]}" | grep -E '^patch-[A-Za-z0-9._-]+\.zip$' || true)

          if [ "${#PATCHES[@]}" -ne 1 ]; then
            echo "Exactly one root-level patch-*.zip must be uploaded in a patch commit."
            printf 'Changed files:\n%s\n' "${ALL_CHANGED[*]}"
            exit 1
          fi

          if [ "${#ALL_CHANGED[@]}" -ne 1 ]; then
            echo "Patch commit must contain only the ZIP file."
            printf 'Changed files:\n%s\n' "${ALL_CHANGED[*]}"
            exit 1
          fi

          PATCH_ZIP="${PATCHES[0]}"
          cp "$PATCH_ZIP" /tmp/autosale-patch.zip
          echo "zip=$PATCH_ZIP" >> "$GITHUB_OUTPUT"
          echo "Patch detected: $PATCH_ZIP"

      - name: Validate ZIP and apply paths safely
        id: apply
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          zip_path = Path('/tmp/autosale-patch.zip')
          patch_name = os.environ['PATCH_ZIP']

          MAX_TOTAL = 200 * 1024 * 1024
          MAX_FILE = 95 * 1024 * 1024
          SOURCE_EXTS = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.css'}

          # Patch ZIPs may never modify the installer itself or build outputs.
          PROTECTED_PREFIXES = (
              '.git/',
              '.github/workflows/',
              '.github/actions/',
              'node_modules/',
              '.next/',
              'out/',
          )
          PROTECTED_FILES = {
              '.env', '.env.local', '.env.production', '.env.development',
              'tsconfig.tsbuildinfo',
          }

          def clean_path(raw: str) -> str:
              if '\\' in raw:
                  raise ValueError(f'Backslashes are not allowed in ZIP paths: {raw!r}')
              if raw.startswith('/'):
                  raise ValueError(f'Absolute path is not allowed: {raw!r}')

              p = PurePosixPath(raw)
              parts = p.parts
              if not parts:
                  raise ValueError('Empty ZIP path is not allowed')
              if any(part in ('', '.', '..') for part in parts):
                  raise ValueError(f'Unsafe path component: {raw!r}')
              if any(part != part.strip() for part in parts):
                  raise ValueError(f'Leading/trailing whitespace in path component: {raw!r}')
              if any(any(ord(ch) < 32 for ch in part) for part in parts):
                  raise ValueError(f'Control character in path: {raw!r}')

              normalized = p.as_posix()
              low = normalized.lower()

              if low in PROTECTED_FILES:
                  raise ValueError(f'Protected file cannot be changed by ZIP patch: {normalized}')
              if any(low.startswith(prefix.lower()) for prefix in PROTECTED_PREFIXES):
                  raise ValueError(f'Protected path cannot be changed by ZIP patch: {normalized}')
              if re.fullmatch(r'patch-[A-Za-z0-9._-]+\.zip', normalized):
                  raise ValueError(f'Nested patch ZIP is not allowed: {normalized}')

              return normalized

          if not zip_path.is_file():
              raise SystemExit('Temporary patch ZIP is missing')

          with zipfile.ZipFile(zip_path) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              if not infos:
                  raise SystemExit('Patch ZIP is empty')

              total = sum(i.file_size for i in infos)
              if total > MAX_TOTAL:
                  raise SystemExit(f'Patch is too large when unpacked: {total} bytes')

              seen = set()
              seen_lower = set()
              files = []
              manifest = None

              for info in infos:
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Symlink is not allowed in ZIP: {info.filename}')
                  if info.file_size > MAX_FILE:
                      raise SystemExit(f'File exceeds safe size limit: {info.filename}')

                  name = clean_path(info.filename)
                  if name in seen or name.lower() in seen_lower:
                      raise SystemExit(f'Duplicate/case-conflicting path in ZIP: {name}')
                  seen.add(name)
                  seen_lower.add(name.lower())

                  if name == '_patch.json':
                      try:
                          manifest = json.loads(zf.read(info).decode('utf-8'))
                      except Exception as exc:
                          raise SystemExit(f'Invalid _patch.json: {exc}')
                      continue

                  files.append((info, name))

              deletes = []
              message = None

              if manifest is not None:
                  if not isinstance(manifest, dict):
                      raise SystemExit('_patch.json must contain a JSON object')

                  raw_deletes = manifest.get('delete', [])
                  if not isinstance(raw_deletes, list) or not all(isinstance(x, str) for x in raw_deletes):
                      raise SystemExit('_patch.json "delete" must be an array of repository paths')

                  deletes = [clean_path(x) for x in raw_deletes]

                  if len({x.lower() for x in deletes}) != len(deletes):
                      raise SystemExit('Duplicate delete paths in _patch.json')

                  raw_message = manifest.get('message')
                  if raw_message is not None:
                      if not isinstance(raw_message, str) or not raw_message.strip():
                          raise SystemExit('_patch.json "message" must be a non-empty string')
                      message = raw_message.strip()[:120]

              if not files and not deletes:
                  raise SystemExit('Patch does not contain files or delete instructions')

              written = []

              for info, name in files:
                  target = (repo / name).resolve()
                  if repo not in target.parents:
                      raise SystemExit(f'Path escaped repository root: {name}')

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, open(target, 'wb') as dst:
                      shutil.copyfileobj(src, dst)

                  written.append(name)

              deleted = []

              for name in deletes:
                  target = (repo / name).resolve()
                  if repo not in target.parents:
                      raise SystemExit(f'Delete path escaped repository root: {name}')

                  if target.is_dir():
                      shutil.rmtree(target)
                      deleted.append(name + '/')
                  elif target.exists():
                      target.unlink()
                      deleted.append(name)

          # Inbox ZIP is never part of the verified repository state.
          inbox = repo / patch_name
          if inbox.exists():
              inbox.unlink()

          # Guards for deployment-breaking source mistakes.
          for name in written:
              path = repo / name

              if path.suffix.lower() in SOURCE_EXTS and path.is_file() and path.stat().st_size == 0:
                  raise SystemExit(f'Rejected zero-byte source file: {name}')

              if name.endswith('/page.tsx') or name == 'page.tsx':
                  text = path.read_text('utf-8', errors='replace')
                  if not re.search(r'export\s+(?:default\b|\{[^}]*\bdefault\b[^}]*\}\s+from\b)', text):
                      raise SystemExit(f'Rejected page.tsx without a default export: {name}')

          # Save the exact patch-controlled paths. The commit step will stage ONLY these.
          Path('/tmp/patch-written.txt').write_text(
              ''.join(f'{x}\n' for x in written), encoding='utf-8'
          )
          Path('/tmp/patch-deleted.txt').write_text(
              ''.join(f'{x.rstrip("/")}\n' for x in deleted), encoding='utf-8'
          )

          if message:
              Path('/tmp/patch-commit-message.txt').write_text(message, encoding='utf-8')

          summary = Path(os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/patch-summary.md'))
          with summary.open('a', encoding='utf-8') as f:
              f.write('## AutoSale ZIP patch\n\n')
              f.write(f'**ZIP:** `{patch_name}`\n\n')
              f.write(f'**Files written:** {len(written)}  \n')
              f.write(f'**Paths deleted:** {len(deleted)}\n\n')
              if written:
                  f.write('### Written\n')
                  for name in written:
                      f.write(f'- `{name}`\n')
              if deleted:
                  f.write('\n### Deleted\n')
                  for name in deleted:
                      f.write(f'- `{name}`\n')
          PY

          echo "ZIP paths validated and applied to temporary working tree."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove generated build artifacts before commit
        shell: bash
        run: |
          set -euo pipefail

          # Build output must NEVER be committed to the repository.
          rm -rf node_modules .next out
          rm -f tsconfig.tsbuildinfo

          echo "Generated build artifacts removed from working tree."

      - name: Commit only verified patch files
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set -euo pipefail

          git config user.name "autosale-patch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never use `git add -A` globally here.
          # Stage only the uploaded ZIP deletion, patch-controlled files,
          # and cleanup of build artifacts accidentally tracked by an older installer.
          git add -A -- "$PATCH_ZIP"

          if [ -s /tmp/patch-written.txt ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git add -A -- "$path"
            done < /tmp/patch-written.txt
          fi

          if [ -s /tmp/patch-deleted.txt ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git add -A -- "$path"
            done < /tmp/patch-deleted.txt
          fi

          # One-time and future-proof cleanup if these were ever tracked.
          git add -A -- .next node_modules out tsconfig.tsbuildinfo 2>/dev/null || true

          # Safety check: reject any staged path outside the allowed set.
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          patch_zip = os.environ['PATCH_ZIP']
          allowed = {patch_zip, '.next', 'node_modules', 'out', 'tsconfig.tsbuildinfo'}

          for list_file in ('/tmp/patch-written.txt', '/tmp/patch-deleted.txt'):
              p = Path(list_file)
              if p.exists():
                  allowed.update(x.strip() for x in p.read_text('utf-8').splitlines() if x.strip())

          staged = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode('utf-8').split('\0')

          unexpected = []
          for path in filter(None, staged):
              if path in allowed:
                  continue
              if any(path.startswith(prefix.rstrip('/') + '/') for prefix in ('.next', 'node_modules', 'out')):
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit(
                  'Refusing commit because unexpected files were staged:\n' +
                  '\n'.join(f'- {x}' for x in unexpected)
              )
          PY

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nothing changed after verification."
            exit 0
          fi

          if [ -s /tmp/patch-commit-message.txt ]; then
            MSG="$(cat /tmp/patch-commit-message.txt)"
          else
            MSG="Apply verified ZIP patch: ${PATCH_ZIP}"
          fi

          git commit -m "$MSG"
          git push origin HEAD:main

      - name: Remove rejected ZIP from main
        if: ${{ failure() && steps.detect.outputs.zip != '' }}
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set +e

          # Restore source tree to exactly the uploaded-patch commit.
          git reset --hard "$GITHUB_SHA"
          git clean -fd

          # Remove only the rejected inbox ZIP and commit that deletion.
          if [ -n "$PATCH_ZIP" ] && [ -f "$PATCH_ZIP" ]; then
            rm -f "$PATCH_ZIP"

            git config user.name "autosale-patch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A -- "$PATCH_ZIP"

            if ! git diff --cached --quiet; then
              git commit -m "Remove rejected ZIP patch: ${PATCH_ZIP}"
              git push origin HEAD:main
            fi
          fi

          echo "Rejected patch was not applied to source files."
